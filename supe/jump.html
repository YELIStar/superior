<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>jump</title>
</head>

<body>
    <!-- 导航链接 -->
    <nav>
        <a href="/home" class="nav-link">首页</a>
        <a href="/about" class="nav-link">关于</a>
        <a href="/contact" class="nav-link">联系</a>
    </nav>

    <!-- 内容展示区域 -->
    <div id="content"></div>

    <script>
        // 1. 定义页面内容（模拟不同页面的模板）
        const pages = {
            '/home': '<h1>首页</h1><p>这是首页内容</p>',
            '/about': '<h1>关于我们</h1><p>这是关于页面内容</p>',
            '/contact': '<h1>联系我们</h1><p>这是联系页面内容</p>'
        };

        // 2. 初始化页面
        function renderPage(path) {
            // 动态更新内容区域
            document.getElementById('content').innerHTML = pages[path] || '<h1>404 页面不存在</h1>';
        }

        // 3. 监听导航点击，实现无刷新跳转
        document.querySelectorAll('.nav-link').forEach(link => {
            link.addEventListener('click', (e) => {
                e.preventDefault(); // 阻止默认跳转（关键）
                const path = link.getAttribute('href');

                // 修改 URL 并添加到历史记录（不刷新页面）
                history.pushState({ path }, '', path);

                // 渲染对应页面内容
                renderPage(path);
            });
        });

        // 4. 监听浏览器前进/后退按钮（popstate 事件）
        window.addEventListener('popstate', (e) => {
            // 用户点击前进/后退时，重新渲染对应页面
            const path = e.state?.path || '/home';
            renderPage(path);
        });

        // 初始加载首页
        renderPage('/about');
    </script>
</body>

</html>
