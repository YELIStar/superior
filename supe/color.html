<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="/cake.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>非阻塞IO输入事件示例</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        // Tailwind配置
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#3B82F6',
                        secondary: '#10B981',
                        accent: '#8B5CF6',
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .content-auto {
                content-visibility: auto;
            }
            .input-focus {
                @apply focus:ring-2 focus:ring-primary/50 focus:border-primary focus:outline-none;
            }
            .card {
                @apply bg-white rounded-lg shadow-md p-6 transition-all duration-300 hover:shadow-lg;
            }
        }
    </style>
</head>

<body class="bg-gray-100 min-h-screen p-4 md:p-8">
    <div class="max-w-3xl mx-auto">
        <header class="mb-8 text-center">
            <h1 class="text-[clamp(1.8rem,4vw,2.5rem)] font-bold text-gray-800 mb-2">
                <i class="fa fa-exchange text-primary mr-2"></i>非阻塞IO输入示例
            </h1>
            <p class="text-gray-600">在输入框中输入文字，查看实时非阻塞处理效果</p>
        </header>

        <div class="card mb-6">
            <label for="inputField" class="block text-gray-700 font-medium mb-2">
                <i class="fa fa-keyboard-o text-primary mr-1"></i>输入框:
            </label>
            <input type="text" id="inputField"
                class="w-full px-4 py-2 border border-gray-300 rounded-md input-focus transition-colors"
                placeholder="在此输入文字...">
        </div>

        <div class="card">
            <label class="block text-gray-700 font-medium mb-2">
                <i class="fa fa-eye text-accent mr-1"></i>实时处理结果:
            </label>
            <div id="outputArea"
                class="w-full min-h-[100px] px-4 py-3 border border-gray-300 rounded-md bg-gray-50 overflow-auto transition-all">
                等待输入...
            </div>
        </div>

        <div class="mt-8 p-4 bg-blue-50 rounded-lg border border-blue-100">
            <h3 class="font-semibold text-blue-800 mb-2 flex items-center">
                <i class="fa fa-info-circle mr-2"></i>工作原理
            </h3>
            <p class="text-blue-700 text-sm">
                这个示例展示了非阻塞IO和事件循环的工作方式。当你在输入框中输入时，输入事件被添加到事件队列，
                事件循环会在适当的时候处理这些事件，更新输出区域的内容和颜色，而不会阻塞其他操作。
            </p>
        </div>
    </div>

    <script type="text/typescript">
        const inputField = document.getElementById('inputField') as HTMLInputElement;
        const outputArea = document.getElementById('outputArea') as HTMLDivElement;
        function getRandomColor(): string {
            const hue = Math.floor(Math.random() * 360);
            const saturation = 70 + Math.floor(Math.random() * 30);
            const lightness = 40 + Math.floor(Math.random() * 20);
            return `hsl(${hue}, ${saturation}%, ${lightness}%)`;
        }
        function handleInput(event: Event): void {
            const input = event.target as HTMLInputElement;
            const text = input.value;
            setTimeout(() => {
                if (text.trim() === '') {
                    outputArea.textContent = '等待输入...';
                    outputArea.style.color = 'inherit';
                } else {
                    outputArea.textContent = text;
                    outputArea.style.color = getRandomColor();
                }
                outputArea.classList.add('scale-105');
                setTimeout(() => {
                    outputArea.classList.remove('scale-105');
                }, 150);
            }, 0);
        }
        inputField.addEventListener('input', handleInput);
        function demonstrateNonBlocking(): void {
            let count = 0;
            const interval = setInterval(() => {
                count++;
                console.log(`事件循环仍在运行... 计数: ${count}`);
                if (count >= 100) {
                    clearInterval(interval);
                    console.log('计数演示结束');
                }
            }, 100);
        }
        demonstrateNonBlocking();
    </script>
</body>

</html>
